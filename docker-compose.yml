version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aurastream-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: spotify_offline_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aurastream-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aurastream-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/spotify_offline_db
      - REDIS_URL=redis://redis:6379/0
      - SPOTIFY_CLIENT_ID=cEYpjA9oz9GiPac4AsH4n
      - SPOTIFY_CLIENT_SECRET=
      - SPOTIFY_REDIRECT_URI=http://localhost:8000/api/auth/spotify/callback
      - STORAGE_PATH=/app/storage
      - SECRET_KEY=aura-stream-super-secret-key-spotify-offline-2026
      - FRONTEND_URL=http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aurastream-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  storage_data:
